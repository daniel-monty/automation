[project]
name = "montycloud-e2e"
version = "0.1.0"
description = "API-first, UI-supported end-to-end BDD automation suite for the MontyCloud platform (pytest + pytest-bdd)."
readme = "README.md"
requires-python = ">=3.11"

# Latest *compatible* pins, researched 2026-06. See README "Versions & compatibility".
# This suite is standalone and runs against deployed environments (default: dev1).
dependencies = [
    # pytest 9.2 removed FixtureManager._arg2fixturedefs, which pytest-bdd 9.0 needs. Raise the
    # cap only after a fresh install passes a real run (not just --collect-only).
    "pytest>=8.3,<9.2",
    "pytest-bdd>=8.1.0,<10",     # BDD layer (plugin on top of pytest — one runner, not two)
    "pytest-xdist>=3.8.0",       # parallel runs (`-n auto --dist loadfile` in CI)
    "pytest-timeout>=2.4.0",     # per-test timeout so a hung call/browser can't stall CI
    "pytest-playwright>=0.8.0",  # UI E2E (thin, critical journeys only)
    "playwright>=1.60.0",        # browser engine; run `playwright install` after pip install
    "httpx>=0.28.1",             # API E2E client (the workhorse)
    "schemathesis>=4.21.0",      # contract/fuzz E2E from an OpenAPI spec (nightly)
    "allure-pytest-bdd>=2.16.0", # adapter: maps Gherkin -> Allure (epic/feature/story + steps)
    "polyfactory>=3.3.0",        # arrange-via-API data factories on Pydantic models
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0", # single typed config object from env
]

[dependency-groups]
dev = [
    # Exact pins: a new ruff release can change formatting (0.17 formats Markdown code blocks)
    # and turn CI red with no code change. Bump deliberately, together with .pre-commit-config.yaml.
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["."]
bdd_features_base_dir = "tests/features"
# allure results land here (wiped each run so reports never mix runs; trends live in
# allure/history/, which is never cleaned). Allure 3 CLI (npm `allure`) renders them.
# Failed UI tests keep a Playwright trace in test-results/ (`playwright show-trace <zip>`).
addopts = "--alluredir=allure-results --clean-alluredir --strict-markers -ra --tracing=retain-on-failure"
timeout = 300  # seconds per test (pytest-timeout); a stuck test fails instead of hanging CI
markers = [
    "smoke: fast must-pass checks; part of the PR gate",
    "critical: business-critical journeys; part of the PR gate",
    "api: API-level E2E (httpx) — the workhorse layer",
    "ui: UI E2E (Playwright) — thin, critical, browser-only journeys",
    "regression: full regression set; nightly only",
    "contract: schemathesis contract/fuzz; nightly only",
    "logged_out: UI scenario starts without the injected login (the login-form journey)",
    "quarantine: known-flaky test kept out of the PR gate, still runs nightly. Humans add/remove it, with a Jira key (README §8.1)",
]

# ---------------------------------------------------------------------------
# ruff (lint + format) — test code held to the same bar as production code
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "ANN"]
# ANN401: Any is legitimate for the base client's httpx passthrough kwargs.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/step_defs/**" = []  # no relaxations: keep step defs honest (no logic/asserts/raw clients)

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["tests", "conftest.py"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
