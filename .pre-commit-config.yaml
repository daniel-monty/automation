# Pre-commit hooks for the E2E suite. Same bar as production code.
# Install once: `pre-commit install`
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3   # keep in sync with the ruff pin in pyproject.toml
    hooks:
      - id: ruff          # lint
        args: [--fix]
      - id: ruff-format   # format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1    # keep in sync with the mypy pin in pyproject.toml
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings
        args: [--config-file=pyproject.toml]
