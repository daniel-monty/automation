name: E2E Gate (PR)

# Fast PR gate: lint + type-check + the @smoke/@critical subset only (minus @quarantine).
# The hard gate is pytest's exit code; Allure 3's quality gate is the reporting-side gate.

on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: e2e-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip  # --group needs pip >= 25.1
          pip install -e . --group dev         # pinned ruff/mypy, same as pre-commit
      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy

  gate:
    name: Smoke + critical
    runs-on: ubuntu-latest
    needs: quality
    env:
      # Secrets injected from GitHub repo/environment secrets (never committed).
      E2E_ENV: dev1
      E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
      E2E_UI_BASE_URL: ${{ secrets.E2E_UI_BASE_URL }}
      E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps + browsers
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium
      - name: Install Allure 3 CLI
        run: npm ci
      # Read-only: PRs show trends from nightly history but never save their own runs into it.
      - name: Restore Allure history (read-only)
        uses: actions/cache/restore@v4
        with:
          path: allure/history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-
      - name: Run gate suite (@smoke or @critical, not @quarantine)
        run: pytest -m "(smoke or critical) and not quarantine" -n auto --dist loadfile
      - name: Generate Allure 3 report
        if: ${{ !cancelled() }}
        run: npm run report:generate
      - name: Allure quality gate (no critical-severity failures)
        if: ${{ !cancelled() }}
        run: npm run report:gate
      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-gate
          path: allure-report
      - name: Upload Playwright traces (failed UI tests)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-gate
          path: test-results
          if-no-files-found: ignore
