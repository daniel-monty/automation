name: E2E Gate (PR)

# Fast PR gate: lint + type-check + the @smoke/@critical subset only.
# The hard gate is pytest's exit code; Allure 3's quality gate is the reporting-side gate.

on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: e2e-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy
      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy

  gate:
    name: Smoke + critical
    runs-on: ubuntu-latest
    needs: quality
    env:
      # Secrets injected from GitHub repo/environment secrets (never committed).
      E2E_ENV: dev1
      E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
      E2E_UI_BASE_URL: ${{ secrets.E2E_UI_BASE_URL }}
      E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps + browsers
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium
      - name: Run gate suite (@smoke or @critical)
        run: pytest -m "smoke or critical" --alluredir=allure-results
      - name: Generate Allure 3 report
        if: always()
        run: |
          npm install -g allure
          allure generate allure-results --output allure-report --config allure/allurerc.mjs
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-gate
          path: allure-report
