name: E2E Nightly

# Full regression + schemathesis contract/fuzz + history update. Failure triage is run by the
# `e2e-failure-triage` Copilot agent against the uploaded artifacts (not a CI step).

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  nightly:
    name: Full regression + contract
    runs-on: ubuntu-latest
    env:
      E2E_ENV: dev1
      E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
      E2E_UI_BASE_URL: ${{ secrets.E2E_UI_BASE_URL }}
      E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_OPENAPI_SPEC: ${{ secrets.E2E_OPENAPI_SPEC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps + browsers
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium
      - name: Install Allure 3 CLI
        run: npm ci
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure/history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-
      # Every scenario, @quarantine included (that's how a fixed flaky test shows up green).
      - name: Full regression (every scenario)
        run: pytest -m "not contract" -n auto --dist loadfile
      # Contract results reach Allure as JUnit XML (allure-pytest-bdd reports Gherkin only).
      # Its own --alluredir keeps --clean-alluredir from wiping the regression results above.
      - name: Contract / fuzz (schemathesis)
        if: ${{ !cancelled() }}
        run: >-
          pytest tests/contract -m contract
          --alluredir=allure-contract
          --junitxml=allure-results/contract-junit.xml
      - name: Sweep leftover e2e- test data
        if: ${{ !cancelled() }}
        run: python -m tests.support.sweep
      - name: Generate Allure 3 report (with history)
        if: ${{ !cancelled() }}
        run: npm run report:generate
      - name: Save Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: allure/history
          key: allure-history-${{ github.run_id }}
      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-nightly
          path: allure-report
      - name: Upload Allure results (raw — input for the e2e-failure-triage agent)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-nightly
          path: allure-results
      - name: Upload Playwright traces (failed UI tests)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-nightly
          path: test-results
          if-no-files-found: ignore
